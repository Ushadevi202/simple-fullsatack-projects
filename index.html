<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
    <style>
        body {
            background-color: lavender;
            margin: 0; 
            font-family: Arial, sans-serif; 
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Keeps footer at bottom if content is short */
        }  
        div {
            /* FIXED: Use max-width and auto margins for perfect centering on all screens */
            max-width: 400px;
            width: 100%;
            margin: 60px auto 0 auto;
            
            border-radius: 20px;
            padding: 50px;
            background: linear-gradient(135deg, rgba(59, 59, 240, 0.705), #4c085f);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); 
            box-sizing: border-box; /* Prevents padding from breaking layout */
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px; 
        }
        ol {
            list-style-type: none; 
            padding: 0; 
            margin: 0;
        }
        li {
            margin: 15px auto; 
            text-align: center;
            background-color: rgb(14, 13, 13);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 180px; /* Slightly wider to prevent long text from spilling out */
            height: 40px;
            transition: background-color 0.3s ease; /* Smooth hover effect */
        }
        a {
            color: white; 
            text-decoration: none; 
            font-size: 18px; 
            display: block;
            width: 100%;
            line-height: 40px;
        }
        /* FIXED: Changing background color on hover makes it feel like a real button */
        li:hover {
            background-color: #3b3bf0; 
        }
        footer {
            text-align: center;
            margin-top: auto; /* Pushes footer neatly to the bottom */
            padding: 20px 0;
            font-size: 17px;
            color: black;
        }

        /* Responsive Design */
        @media (max-width: 500px) {
            div {
                margin: 20px; 
                padding: 30px; 
            }
            h1 {
                font-size: 1.8em; 
            }
        }
    </style>
</head>
<body>
    <div>
        <h1>Welcome to My Website!</h1>
        
        <ol>
            <li><a href="Quiz App/index.html">Quiz App</a></li>
            <li><a href="AgeCalculator/index.html">Age Calculator</a></li>
            <li><a href="booksky/index.html">BookSky</a></li>
            <li><a href="image-gallery/index.html">Image Gallery</a></li>
            <li><a href="txt-speech/index.html">Text into Speech</a></li>
        </ol>
    </div>
    <footer>
        &copy; 2026 Ushadevi. All Rights Reserved.
    </footer>
</body>
</html>
